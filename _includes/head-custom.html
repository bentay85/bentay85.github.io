<!-- Site-wide customizations for jekyll-theme-midnight.
     The midnight theme's default layout is replaced by our own
     _layouts/default.html, so this file only layers CSS on top of the
     theme's stylesheet and adds the copy buttons to code blocks.
     Everything else (banner, post list, footer) is real page markup
     built by Jekyll - no template + script rearranging.

     Layout model:
       body (normal document flow, the page scrolls normally, so
       keyboard scrolling works)
       ├── .site-banner  one slim title line, links back home
       ├── .wrapper flex row: #site-nav (sticky post list) | section
       └── .site-footer  credits, at the bottom of the page
       Narrow screens (<1031px) stack the columns, post list below
       the content. -->
<style>
  /* The midnight theme never sets box-sizing, so every element is
     content-box: padding is added *outside* a max-width, and a column
     sized exactly to the window ends up wider than the window by its
     own padding. Standardize on border-box. */
  *, *::before, *::after { box-sizing: border-box; }

  /* The page itself scrolls (no app-shell with a hidden body), so
     space / Page Down / arrow keys work as usual. The sidebar stays
     beside the text with position: sticky below. */
  html {
    color-scheme: dark;
    scrollbar-width: thin;
    scrollbar-color: #434343 transparent;
    /* Always reserve the scrollbar lane so short and long pages never
       shift horizontally; the fallback covers browsers without
       scrollbar-gutter. */
    scrollbar-gutter: stable;
  }
  @supports not (scrollbar-gutter: stable) {
    html { overflow-y: scroll; }
  }
  body { max-width: none; margin: 0; padding: 0; }

  /* Dark scrollbars: declare the page as dark so native scrollbar
     parts render dark, and style the WebKit track/thumb to match the
     theme colors on Chrome/Edge. The 3px transparent border creates
     space between text and the slim thumb. */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: #434343;
    background-clip: padding-box;
    border: 3px solid transparent;
    border-radius: 5px;
  }
  ::-webkit-scrollbar-thumb:hover { background-color: #555555; }

  /* Banner: one slim line with the site title, linking home. The tagline
     and the credits that used to sit here moved to the prose (index.md)
     and to the footer, so the banner no longer eats a slab of the
     viewport on laptops and phones. Colors mirror the theme's own. */
  .site-banner {
    background: #2c2c2b;
    border-bottom: 4px solid #434343;
    padding: 7px 0 8px;
  }
  .banner-title {
    font-family: 'OpenSansLight', "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: normal;
    font-size: 26px;
    line-height: 32px;
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 20px;
    text-align: center;
  }
  .banner-title a { color: #e8e8e8; text-decoration: none; }
  .banner-title a:hover { color: #ffeb9b; }
  /* On the home page the banner title is the page's only h1 (post pages
     take their h1 from the post heading, so there the banner is just
     styled text). Kill the theme's big h1 styles here. */
  .banner-title h1 {
    font-family: inherit;
    font-weight: normal;
    font-size: 26px;
    line-height: 32px;
    margin: 0;
  }

  /* Row layout: post list beside the content, the pair centered under
     the banner, growing with the window up to 1280px (half of 1440p)
     and stopping there - the text column absorbs the extra width up
     to that point for reading comfort. */
  .wrapper {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 36px;
    /* border-box, so 1280px is the whole group including its own
       padding; width:100% keeps it inside a narrower window. */
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
    padding: 12px 20px 28px;
  }
  .wrapper section {
    /* take all the width left next to the 240px panel; max-width:none
       releases the theme's own `section { max-width: 650px }` cap */
    flex: 1 1 640px;
    max-width: none;
    min-width: 0;
    order: 2;
    /* the column itself never scrolls sideways; a wide code block
       scrolls inside its own box instead of pushing text off screen
       (hidden is the fallback for browsers without clip) */
    overflow-x: hidden;
    overflow-x: clip;
    /* kill the theme's margin-top and padding-top on section */
    margin: 0;
    padding: 0 14px 0 0;
  }
  #site-nav {
    /* The theme hides all bare `nav` elements at <=480px (intended
       for its header bar). display:block here outranks that type
       selector at every width, so the post list is never hidden. */
    display: block;
    flex: 0 0 240px;
    order: 1;
    /* the sidebar follows the page as it scrolls, stopping 12px from
       the top; a very long list scrolls inside its own box */
    position: sticky;
    top: 12px;
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    font-size: 12px;
    line-height: 1.5;
  }
  #site-nav .nav-home {
    display: block;
    font-size: 14px;
    color: #ffcc00;
    margin: 12px 0 0;
    text-align: center;
  }
  #site-nav ul { list-style: none; margin: 0; padding: 0; }
  #site-nav li { margin: 0 0 7px; }
  #site-nav a { color: #d7cfbe; text-decoration: none; display: block; }
  /* Exact hanging indent: the date and title are two flex items, so
     every wrapped title line aligns precisely with the first.
     Titles left-align (the column is too narrow to justify without
     large word gaps); dates right-align inside their fixed column. */
  #site-nav li a {
    display: flex;
    align-items: baseline;
    column-gap: 0.5em;
    text-align: left;
  }
  #site-nav a:hover { color: #ffeb9b; }
  #site-nav a.current { color: #ffcc00; }
  /* Date column: fixed width, never wraps, two stacked lines
     (year, then day+month) right-aligned toward the titles, so
     every title starts at the same x. */
  #site-nav .nav-date {
    color: #696969;
    flex: 0 0 auto;
    width: 3.4em;
    white-space: nowrap;
    text-align: right;
  }
  #site-nav .nav-date > span { display: block; }

  /* Footer: the credits the theme used to float inside the banner. */
  .site-footer {
    background: #2c2c2b;
    border-top: 4px solid #434343;
    padding: 12px 0 16px;
    font-size: 11px;
    color: #696969;
  }
  .site-footer .footer-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px 20px;
  }
  .site-footer a { color: #d7cfbe; text-decoration: none; }
  .site-footer a:hover { color: #ffeb9b; }

  /* Justified prose within the content column, on every page, at
     every width. Words are never hyphenated: a word that does not
     fit moves whole to the next line, and the line is stretched to
     fill the width. overflow-wrap: break-word only breaks a token
     longer than a whole line (a very long URL). Code blocks are
     excluded (justified code looks broken). */
  section p, section li {
    text-align: justify;
    hyphens: none;
    -webkit-hyphens: none;
    overflow-wrap: break-word;
  }
  section pre {
    text-align: left;
    /* extra top padding: the strip where the Copy button sits, so
       the button never covers code */
    padding: 28px 15px 8px;
  }
  /* Wide code blocks and tables scroll inside their own box at every
     width, so they can never widen the reading column or push prose
     off the screen. */
  section pre, section table { max-width: 100%; overflow-x: auto; }
  /* Copy-code button (added by the script to every code block).
     It sits on a wrapper div around the pre, so it stays put even
     when a wide block scrolls sideways. */
  .code-holder { position: relative; }
  .code-holder .copy-btn {
    position: absolute;
    top: 6px;
    right: 10px;
    font: 11px/1.4 "OpenSansRegular", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #d7cfbe;
    background: #2c2c2b;
    border: 1px solid #434343;
    border-radius: 3px;
    padding: 3px 10px;
    cursor: pointer;
  }
  .code-holder .copy-btn:hover { color: #ffeb9b; border-color: #696969; }
  .code-holder .copy-btn.copied { color: #7ac74f; border-color: #7ac74f; }

  /* Too narrow for the beside layout: stack the columns, content
     first, post list at the bottom of the page. */
  @media (max-width: 1030px) {
    .wrapper {
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      padding: 12px 20px 0;
    }
    .wrapper section { flex: none; order: 1; padding-bottom: 0; }
    /* no dead space between the end of the post and the list */
    .wrapper section > :last-child { margin-bottom: 0; }
    /* Post list moves to the bottom of the page, below the content. */
    #site-nav {
      flex: none;
      order: 2;
      position: static;
      max-height: none;
      overflow: visible;
      margin: 24px 0 10px;
      border-top: 3px solid #434343;
      padding: 16px 0 0;
    }
    #site-nav ul { margin: 10px 0 0; }
  }

  /* Phone portrait: tighter banner, comfortable tap spacing. */
  @media (max-width: 720px) {
    .banner-title { font-size: 20px; line-height: 26px; }
    #site-nav { font-size: 13px; }
    #site-nav li { margin: 0 0 10px; }
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    // Copy button on every code block in the page content.
    document.querySelectorAll('section pre').forEach(function (pre) {
      var holder = document.createElement('div');
      holder.className = 'code-holder';
      pre.parentNode.insertBefore(holder, pre);
      holder.appendChild(pre);

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'copy-btn';
      btn.textContent = 'Copy';
      btn.setAttribute('aria-label', 'Copy the code in this block');
      holder.appendChild(btn);

      btn.addEventListener('click', function () {
        var text = pre.innerText;
        var reset = function (label) {
          btn.textContent = label;
          btn.classList.toggle('copied', label === 'Copied');
          window.setTimeout(function () {
            btn.textContent = 'Copy';
            btn.classList.remove('copied');
          }, 2000);
        };
        var legacyCopy = function () {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { /* fall through */ }
          document.body.removeChild(ta);
          reset(ok ? 'Copied' : 'Copy failed');
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            function () { reset('Copied'); },
            legacyCopy
          );
        } else {
          legacyCopy();
        }
      });
    });
  });
</script>
