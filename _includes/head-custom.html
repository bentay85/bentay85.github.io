<!-- Site-wide customizations for jekyll-theme-midnight.
     This file overrides the theme's own _includes/head-custom.html
     (documented override for gem-based themes) and is injected into
     the <head> of every page. -->
<style>
  /* Remove the fixed top bar ("View On GitHub" button) on every page,
     and pull the page content up into the freed space. */
  #header { display: none; }
  section { margin-top: 30px; }

  /* Stop the ~8px layout shift between pages that have a scrollbar
     (long posts) and pages that don't (home): always reserve the
     scrollbar gutter so the centered column never moves. */
  html { scrollbar-gutter: stable; }
  @supports not (scrollbar-gutter: stable) {
    html { overflow-y: scroll; }
  }

  /* The reserved gutter is painted as a light Windows scrollbar
     track, which shows as a white bar next to this dark theme.
     Declare the page as dark so browsers render the scrollbar and
     its reserved lane dark, and style the WebKit track/thumb to
     match the theme colors on Chrome/Edge. */
  html { color-scheme: dark; }
  ::-webkit-scrollbar { width: 14px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #434343; border-radius: 7px; }
  ::-webkit-scrollbar-thumb:hover { background: #555555; }

  /* Justified prose within the theme's 650px column, on every page.
     Hyphenation keeps the edges clean at this width. Code blocks are
     excluded (justified code looks broken). */
  section p, section li {
    text-align: justify;
    hyphens: auto;
    -webkit-hyphens: auto;
  }
  section pre { text-align: left; }

  /* Site banner: turn the theme's title block (site title,
     description, credits) into a banner that spans the full viewport
     width and sits above the content and the side panel. The wide
     negative margin stretches it out of the 650px column. */
  section #title {
    width: calc(100vw + 24px);
    margin: 0 0 30px calc(50% - 50vw - 12px);
    padding: 24px 40px 14px;
    box-sizing: border-box;
    background: #2c2c2b;
    border-bottom: 4px solid #434343;
  }
  section #title h1 { margin-bottom: 6px; }
  section #title .credits { margin-top: 4px; }

  /* Post navigation panel: fixed side panel below the banner, in the
     empty space left of the centered 650px column. --banner-h is set
     by the script below to the banner's real height. Below 1220px a
     side panel would collide with the column, so it becomes a normal
     block at the bottom of every page instead. */
  #site-nav {
    position: fixed;
    top: calc(var(--banner-h, 190px) + 16px);
    left: 24px;
    width: 230px;
    max-height: calc(100vh - var(--banner-h, 190px) - 32px);
    overflow-y: auto;
    border-left: 3px solid #434343;
    padding-left: 12px;
    font-size: 12px;
    line-height: 1.5;
  }
  #site-nav .nav-home {
    display: block;
    font-size: 14px;
    color: #ffcc00;
    margin-bottom: 10px;
  }
  #site-nav ul { list-style: none; margin: 0; padding: 0; }
  #site-nav li { margin: 0 0 7px; }
  #site-nav a { color: #d7cfbe; text-decoration: none; display: block; }
  #site-nav a:hover { color: #ffeb9b; }
  #site-nav a.current { color: #ffcc00; }
  #site-nav .nav-date { color: #696969; }
  @media (max-width: 1220px) {
    #site-nav {
      position: static;
      width: auto;
      max-width: 650px;
      max-height: none;
      margin: 30px auto 0;
      border-left: none;
      border-top: 3px solid #434343;
      padding: 16px 20px 0;
    }
  }
</style>

<!-- Post list rendered by Jekyll at build time (oldest first), hidden
     in a template and moved into the page body by the script below. -->
<template id="site-nav-template">
  <nav id="site-nav" aria-label="Site posts">
    <a class="nav-home" href="{{ '/' | relative_url }}">Home - all posts</a>
    <ul>
      {% for post in site.posts reversed %}
      <li>
        <a href="{{ post.url | relative_url }}">
          <span class="nav-date">{{ post.date | date: "%Y-%m-%d" }}</span>
          {{ post.title }}
        </a>
      </li>
      {% endfor %}
    </ul>
  </nav>
</template>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var t = document.getElementById('site-nav-template');
    if (t) {
      document.body.appendChild(t.content.cloneNode(true));
    }
    // Highlight the link for the page being viewed.
    var here = location.pathname.replace(/\/+$/, '');
    document.querySelectorAll('#site-nav a').forEach(function (a) {
      var href = a.getAttribute('href').replace(/\/+$/, '');
      if (href === here || '/' + href === here || (here === '' && href === '/')) {
        a.classList.add('current');
      }
    });
    // Position the side panel below the banner using its real height.
    var banner = document.querySelector('section #title');
    if (banner) {
      document.documentElement.style.setProperty('--banner-h', banner.offsetHeight + 'px');
    }
  });
</script>
